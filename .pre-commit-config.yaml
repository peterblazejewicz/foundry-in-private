# Install once per clone:  uv run pre-commit install
# Run on all files:        uv run pre-commit run --all-files
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
# Generated lock files: git normalises line endings (.gitattributes); hooks do not rewrite them.
exclude: (^|/)(packages.lock.json|uv.lock)$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=no]
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false

      - id: dotnet-format
        name: dotnet format (verify)
        entry: dotnet format screens/Screens.slnx --verify-no-changes
        language: system
        files: ^screens/.*\.(cs|csproj|props|slnx|axaml)$
        pass_filenames: false
