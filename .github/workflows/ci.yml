name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest

  dotnet:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore screens/Screens.slnx --locked-mode
      - run: dotnet build screens/Screens.slnx -c Release --no-restore
      - run: dotnet test --solution screens/Screens.slnx -c Release --no-build
      - name: Contract models are current generator output
        run: dotnet run --project screens/tools/ContractGen -c Release --no-build -- --check
      - run: dotnet format screens/Screens.slnx --verify-no-changes --no-restore
      - run: dotnet publish screens/src/Screen.B/Screen.B.csproj -c Release -r linux-arm64 --self-contained false -o out/screen-b

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
