[project]
name = "cell-board-b"
version = "0.1.0"
description = "Board B, reasoning and actuation node: cell controller, agent, offline state machine, findings, mcu.* MCP."
requires-python = ">=3.12,<3.13"
dependencies = ["cell-shared"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "board_b"

[tool.uv.sources]
cell-shared = { workspace = true }
