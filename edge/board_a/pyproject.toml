[project]
name = "cell-board-a"
version = "0.1.0"
description = "Board A, perception node: capture, detector (ORT-QNN), image store, vision.* MCP server."
requires-python = ">=3.12,<3.13"
dependencies = ["cell-shared"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "board_a"

[tool.uv.sources]
cell-shared = { workspace = true }
