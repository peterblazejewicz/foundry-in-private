[project]
name = "cell-shared"
version = "0.1.0"
description = "Shared code for both boards: contract models, telemetry, config."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.14,<3",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cell_shared"
